org: luisignaciocc
app: portal-uno-aws-scrapper
service: portal-uno-aws-scrapper
stages:
  default:
    params:
      tableName: "cotization-table-${sls:stage}"
provider:
  name: aws
  runtime: nodejs18.x
  architecture: x86_64
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [CotizationTable, Arn]
  environment:
    COTIZATION_TABLE: ${param:tableName}
package:
  exclude:
    - node_modules/@aws-sdk/**
    - .git/**
    - README.md
    - package-lock.json
functions:
  api:
    handler: handler.handler
    memorySize: 128
    events:
      - httpApi: "*"
  scraper:
    handler: scraper.scraper
    memorySize: 1024
    timeout: 120
    layers:
      - arn:aws:lambda:us-east-1:764866452798:layer:chrome-aws-lambda:45
    events:
      - schedule:
          rate: cron(0 0 1 * ? *)
          description: "Runs every 1st of month"
    environment:
      # Antes: ${env:USERNAME_SCRAPER} / ${env:PASSWORD_SCRAPER}
      # Esos solo funcionan si corres "serverless deploy" desde una shell
      # donde exportaste esas variables tú mismo. El CI/CD del Dashboard
      # corre en la infraestructura de Serverless, no en tu shell, así que
      # ahí esas variables nunca existirían.
      # Ahora usan ${param:} que resuelve, en orden: --param CLI, stages en
      # este archivo, y finalmente los Parameters guardados en el Dashboard
      # (app.serverless.com > Settings > Parameters, encriptados).
      USERNAME_SCRAPER: ${param:usernameScraper}
      PASSWORD_SCRAPER: ${param:passwordScraper}
resources:
  Resources:
    CotizationTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: registration_date
            AttributeType: S
        KeySchema:
          - AttributeName: registration_date
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${param:tableName}
